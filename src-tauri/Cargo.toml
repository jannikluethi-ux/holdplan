[package]
name = "holdplan"
version = "0.1.0"
description = "Holdplan — 3D load planning"
authors = ["Holdplan"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "holdplan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
